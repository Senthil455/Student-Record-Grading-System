name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run the full Maven build
        run: ./mvnw -B clean verify

      - name: Upload executable JARs
        uses: actions/upload-artifact@v4
        with:
          name: scholaris-jars
          path: |
            student-record-system/target/student-record-system-*.jar
            grading-service/target/grading-service-*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build main application image
        run: docker build --build-arg MODULE=student-record-system -t scholaris/main:ci .

      - name: Build grading service image
        run: docker build --build-arg MODULE=grading-service -t scholaris/grading:ci .
