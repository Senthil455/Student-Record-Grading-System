<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" font-family="'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f2a44"/>
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b58a1b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2a44" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#2f4166"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#e0bd52"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="940" fill="#f7f4ec"/>
  <text x="60" y="56" font-size="31" font-weight="700" fill="#1f2a44">Scholaris — System Architecture</text>
  <text x="60" y="84" font-size="15" fill="#5f6b7a">A Spring Boot MVC monolith with an independent, stateless grading microservice</text>
  <line x1="60" y1="98" x2="1440" y2="98" stroke="#d9d2c0" stroke-width="1.5"/>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="205" height="125" rx="14" fill="#ffffff" stroke="#d9d2c0" stroke-width="1.5"/>
  </g>
  <circle cx="108" cy="198" r="21" fill="#f1ead6"/>
  <circle cx="108" cy="192" r="7" fill="#1f2a44"/>
  <path d="M94 212c1-9 7-13 14-13s13 4 14 13" fill="#1f2a44"/>
  <text x="142" y="190" font-size="16" font-weight="700" fill="#1f2a44">Student / Faculty</text>
  <text x="142" y="211" font-size="13" fill="#5f6b7a">Web browser</text>
  <text x="82" y="248" font-size="12.5" fill="#5f6b7a">HTML pages · JSON API</text>
  <text x="82" y="264" font-size="12.5" fill="#5f6b7a">Swagger UI · H2 console</text>

  <!-- Main application -->
  <g filter="url(#shadow)">
    <rect x="330" y="120" width="745" height="630" rx="16" fill="#ffffff" stroke="#1f2a44" stroke-width="1.6"/>
  </g>
  <path d="M330 136a16 16 0 0 1 16-16h713a16 16 0 0 1 16 16v30H330z" fill="url(#navy)"/>
  <text x="352" y="159" font-size="16" font-weight="700" fill="#ffffff">student-record-system</text>
  <text x="760" y="159" font-size="13.5" fill="#d9e2f2">Spring Boot 3 · port 8080</text>

  <!-- Presentation layer -->
  <text x="354" y="192" font-size="11.5" font-weight="700" fill="#b58a1b" letter-spacing="1.4">PRESENTATION</text>
  <rect x="354" y="203" width="330" height="94" rx="10" fill="#fbf8ef" stroke="#d9d2c0"/>
  <text x="370" y="228" font-size="15" font-weight="700" fill="#1f2a44">Thymeleaf MVC views</text>
  <text x="370" y="249" font-size="12.5" fill="#5f6b7a">Dashboard · Students · Courses</text>
  <text x="370" y="268" font-size="12.5" fill="#5f6b7a">Enrollments · Reports · Errors</text>
  <text x="370" y="287" font-size="12" fill="#8a6a12">Scholaris design system + vanilla JS</text>

  <rect x="704" y="203" width="347" height="94" rx="10" fill="#fbf8ef" stroke="#d9d2c0"/>
  <text x="720" y="228" font-size="15" font-weight="700" fill="#1f2a44">REST API + OpenAPI</text>
  <text x="720" y="249" font-size="12.5" fill="#5f6b7a">/api/students · /api/courses</text>
  <text x="720" y="268" font-size="12.5" fill="#5f6b7a">/api/enrollments · /api/reports</text>
  <text x="720" y="287" font-size="12" fill="#8a6a12">Swagger UI at /swagger-ui.html</text>

  <!-- Web layer band -->
  <rect x="354" y="315" width="697" height="54" rx="9" fill="#eef1f6" stroke="#c8d0de"/>
  <text x="370" y="337" font-size="13.5" font-weight="700" fill="#1f2a44">Spring MVC · DispatcherServlet · Bean Validation</text>
  <text x="370" y="356" font-size="12" fill="#5f6b7a">Controllers · @ControllerAdvice · DTO binding · Thymeleaf view resolution</text>

  <!-- Service layer -->
  <text x="354" y="399" font-size="11.5" font-weight="700" fill="#b58a1b" letter-spacing="1.4">SERVICE LAYER</text>
  <g>
    <rect x="354" y="410" width="128" height="92" rx="9" fill="#ffffff" stroke="#c8d0de"/>
    <text x="364" y="433" font-size="12.5" font-weight="700" fill="#1f2a44">Student</text>
    <text x="364" y="450" font-size="12.5" font-weight="700" fill="#1f2a44">Service</text>
    <text x="364" y="473" font-size="11" fill="#5f6b7a">CRUD · search</text>
    <text x="364" y="489" font-size="11" fill="#5f6b7a">transcripts</text>

    <rect x="491" y="410" width="128" height="92" rx="9" fill="#ffffff" stroke="#c8d0de"/>
    <text x="501" y="433" font-size="12.5" font-weight="700" fill="#1f2a44">Course</text>
    <text x="501" y="450" font-size="12.5" font-weight="700" fill="#1f2a44">Service</text>
    <text x="501" y="473" font-size="11" fill="#5f6b7a">CRUD · roster</text>
    <text x="501" y="489" font-size="11" fill="#5f6b7a">statistics</text>

    <rect x="628" y="410" width="128" height="92" rx="9" fill="#ffffff" stroke="#c8d0de"/>
    <text x="638" y="433" font-size="12.5" font-weight="700" fill="#1f2a44">Enrollment</text>
    <text x="638" y="450" font-size="12.5" font-weight="700" fill="#1f2a44">Service</text>
    <text x="638" y="473" font-size="11" fill="#5f6b7a">record marks</text>
    <text x="638" y="489" font-size="11" fill="#5f6b7a">calls grading API</text>

    <rect x="765" y="410" width="128" height="92" rx="9" fill="#ffffff" stroke="#c8d0de"/>
    <text x="775" y="433" font-size="12.5" font-weight="700" fill="#1f2a44">Report</text>
    <text x="775" y="450" font-size="12.5" font-weight="700" fill="#1f2a44">Service</text>
    <text x="775" y="473" font-size="11" fill="#5f6b7a">HQL aggregates</text>
    <text x="775" y="489" font-size="11" fill="#5f6b7a">rankings</text>

    <rect x="902" y="410" width="149" height="92" rx="9" fill="#ffffff" stroke="#c8d0de"/>
    <text x="912" y="433" font-size="12.5" font-weight="700" fill="#1f2a44">HibernateDemo</text>
    <text x="912" y="450" font-size="12.5" font-weight="700" fill="#1f2a44">Service</text>
    <text x="912" y="473" font-size="11" fill="#5f6b7a">SessionFactory</text>
    <text x="912" y="489" font-size="11" fill="#5f6b7a">Session · Transaction</text>
  </g>

  <!-- Persistence layer -->
  <text x="354" y="537" font-size="11.5" font-weight="700" fill="#b58a1b" letter-spacing="1.4">PERSISTENCE</text>
  <rect x="354" y="548" width="330" height="105" rx="10" fill="#fbf8ef" stroke="#d9d2c0"/>
  <text x="370" y="573" font-size="14.5" font-weight="700" fill="#1f2a44">Spring Data JPA</text>
  <text x="370" y="594" font-size="12" fill="#5f6b7a">StudentRepository · CourseRepository</text>
  <text x="370" y="612" font-size="12" fill="#5f6b7a">EnrollmentRepository · InstructorRepository</text>
  <text x="370" y="631" font-size="12" fill="#8a6a12">@Query HQL · @EntityGraph · projections</text>

  <rect x="704" y="548" width="347" height="105" rx="10" fill="#fbf8ef" stroke="#d9d2c0"/>
  <text x="720" y="573" font-size="14.5" font-weight="700" fill="#1f2a44">Hibernate ORM 6</text>
  <text x="720" y="594" font-size="12" fill="#5f6b7a">Entities: Person → Student / Instructor</text>
  <text x="720" y="612" font-size="12" fill="#5f6b7a">Course · Enrollment (join entity)</text>
  <text x="720" y="631" font-size="12" fill="#8a6a12">JOINED inheritance · IDENTITY ids · transactions</text>

  <!-- Cross-cutting band -->
  <rect x="354" y="673" width="697" height="54" rx="9" fill="#1f2a44"/>
  <text x="370" y="695" font-size="13" font-weight="700" fill="#e0bd52">Cross-cutting concerns</text>
  <text x="370" y="714" font-size="12" fill="#d9e2f2">AOP request logging · global exception handling · DTO mapping · model attributes · Actuator</text>

  <!-- Database -->
  <g filter="url(#shadow)">
    <rect x="392" y="800" width="275" height="102" rx="12" fill="#ffffff" stroke="#1f2a44"/>
  </g>
  <ellipse cx="430" cy="824" rx="23" ry="8" fill="#e0bd52"/>
  <path d="M407 824v22c0 4.4 10.3 8 23 8s23-3.6 23-8v-22" fill="#f1ead6" stroke="#b58a1b"/>
  <ellipse cx="430" cy="824" rx="23" ry="8" fill="none" stroke="#b58a1b"/>
  <text x="468" y="827" font-size="14.5" font-weight="700" fill="#1f2a44">Database</text>
  <text x="468" y="847" font-size="12" fill="#5f6b7a">H2 file DB (default)</text>
  <text x="468" y="864" font-size="12" fill="#5f6b7a">MySQL 8 profile</text>
  <text x="468" y="881" font-size="11.5" fill="#8a6a12">persons · students · instructors · courses · enrollments</text>

  <!-- Grading microservice -->
  <g filter="url(#shadow)">
    <rect x="1130" y="150" width="310" height="495" rx="16" fill="#ffffff" stroke="#1f2a44" stroke-width="1.6"/>
  </g>
  <path d="M1130 166a16 16 0 0 1 16-16h278a16 16 0 0 1 16 16v30h-310z" fill="url(#gold)"/>
  <text x="1152" y="189" font-size="15" font-weight="700" fill="#1f2a44">grading-service</text>
  <text x="1152" y="207" font-size="12" fill="#5c470a">Spring Boot · port 8081</text>

  <rect x="1152" y="232" width="266" height="78" rx="9" fill="#fbf8ef" stroke="#d9d2c0"/>
  <text x="1166" y="256" font-size="13.5" font-weight="700" fill="#1f2a44">GradeController</text>
  <text x="1166" y="275" font-size="11.5" fill="#5f6b7a">GET  /api/grade/scale</text>
  <text x="1166" y="292" font-size="11.5" fill="#5f6b7a">POST /api/grade/evaluate · /gpa</text>
  <text x="1166" y="306" font-size="11.5" fill="#5f6b7a">GET  /api/grade/health</text>

  <rect x="1152" y="326" width="266" height="80" rx="9" fill="#eef1f6" stroke="#c8d0de"/>
  <text x="1166" y="350" font-size="13.5" font-weight="700" fill="#1f2a44">GradeCalculator</text>
  <text x="1166" y="369" font-size="11.5" fill="#5f6b7a">A+ 90 · A 85 · B+ 75 · B 65</text>
  <text x="1166" y="386" font-size="11.5" fill="#5f6b7a">C 55 · D 45 · F below 45</text>
  <text x="1166" y="401" font-size="11.5" fill="#8a6a12">credit-weighted GPA · validation</text>

  <rect x="1152" y="422" width="266" height="94" rx="9" fill="#fbf8ef" stroke="#d9d2c0"/>
  <text x="1166" y="446" font-size="13.5" font-weight="700" fill="#1f2a44">Stateless REST design</text>
  <text x="1166" y="465" font-size="11.5" fill="#5f6b7a">No database · no session state</text>
  <text x="1166" y="482" font-size="11.5" fill="#5f6b7a">JSON request / response records</text>
  <text x="1166" y="499" font-size="11.5" fill="#8a6a12">Actuator health · OpenAPI docs</text>

  <rect x="1152" y="532" width="266" height="86" rx="9" fill="#1f2a44"/>
  <text x="1166" y="556" font-size="13" font-weight="700" fill="#e0bd52">Resilience contract</text>
  <text x="1166" y="575" font-size="11.5" fill="#d9e2f2">Main app calls evaluate() with a 1.5 s</text>
  <text x="1166" y="592" font-size="11.5" fill="#d9e2f2">connect timeout and falls back locally.</text>
  <text x="1166" y="608" font-size="11.5" fill="#e0bd52">graded_by records the source of the grade.</text>

  <!-- Arrows -->
  <line x1="265" y1="212" x2="326" y2="212" stroke="#1f2a44" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="282" y="234" font-size="11.5" fill="#1f2a44">HTTP</text>

  <!-- Request to grading -->
  <path d="M1055 236 C1090 236 1095 262 1126 262" fill="none" stroke="#b58a1b" stroke-width="2.4" marker-end="url(#arrowGold)"/>
  <text x="1088" y="240" font-size="11" fill="#8a6a12">REST</text>
  <path d="M1126 300 C1095 300 1090 292 1058 292" fill="none" stroke="#b58a1b" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowGold)"/>
  <text x="1088" y="322" font-size="11" fill="#8a6a12">JSON</text>

  <!-- DB arrow -->
  <line x1="700" y1="750" x2="610" y2="796" stroke="#1f2a44" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="470" y="782" font-size="11.5" fill="#1f2a44">JPA / Hibernate / SQL</text>

  <!-- Legend -->
  <rect x="60" y="790" width="285" height="112" rx="10" fill="#ffffff" stroke="#d9d2c0"/>
  <text x="78" y="814" font-size="12.5" font-weight="700" fill="#1f2a44">Legend</text>
  <line x1="78" y1="834" x2="118" y2="834" stroke="#1f2a44" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="130" y="838" font-size="11.5" fill="#5f6b7a">HTTP request / response</text>
  <line x1="78" y1="858" x2="118" y2="858" stroke="#b58a1b" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrowGold)"/>
  <text x="130" y="862" font-size="11.5" fill="#5f6b7a">REST call with local fallback</text>
  <line x1="78" y1="882" x2="118" y2="882" stroke="#1f2a44" stroke-width="2.4"/>
  <text x="130" y="886" font-size="11.5" fill="#5f6b7a">JDBC / ORM persistence</text>

  <text x="1180" y="700" font-size="11.5" fill="#5f6b7a">Independent deployment unit</text>
  <text x="1180" y="718" font-size="11.5" fill="#5f6b7a">Own port, own process, own tests</text>
  <text x="1180" y="736" font-size="11.5" fill="#5f6b7a">No shared database with the monolith</text>
</svg>
