spring.application.name=grading-service
server.port=8081

# Small service, so only health and info endpoints are exposed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.root=INFO
logging.level.com.example.gradingservice=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
