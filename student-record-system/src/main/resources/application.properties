spring.application.name=student-record-system
server.port=8080

# ---------------------------------------------------------------
# Database (H2 file database for zero-setup local development)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/studentdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ---------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------
spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

# ---------------------------------------------------------------
# Grading microservice
# ---------------------------------------------------------------
grading.service.base-url=http://localhost:8081
grading.service.enabled=true

# Seed demo data only when the database is empty.
app.seed.enabled=true

# ---------------------------------------------------------------
# API documentation
# ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------
# Actuator / errors
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.whitelabel.enabled=false

logging.level.root=INFO
logging.level.com.example.studentrecord=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
