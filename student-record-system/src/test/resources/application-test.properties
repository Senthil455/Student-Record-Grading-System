spring.datasource.url=jdbc:h2:mem:studentrecord-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.seed.enabled=false
grading.service.enabled=false
grading.service.base-url=http://localhost:65535

spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.com.example.studentrecord=INFO
